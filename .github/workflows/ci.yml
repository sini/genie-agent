name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FAST_CHECKS: >-
    agents-md-citations
    ci-plane-coverage
    ci-self-input
    corpus
    default
    mdformat-plugins
    operating-memory
    package
    root-image-fixtures
    root-surface
    schemas
    support-memory
    treefmt-tree-root
  UNIT_CHECKS: >-
    archive
    bank
    broker
    dispatcher
    distiller
    escalation
    eval-argv
    eval-cache
    eval-k8s
    eval-limits
    eval-lock
    gc
    gist
    guard
    lifecycle
    mirror
    nixos-module
    pr
    portable-unit
    redactor
    state
    supervisor
    tier
  INTEGRATION_CHECKS: >-
    bwrap-selection
    container-worker
    dispatcher-sea
    expert-isolation
    genie-guard-sea
    image
    root
    root-image
    root-sea
    portable-baseline
    tier1
    tier1-bridge
    xmsg-integration

# One upstream-Nix column, not gen-harness's three-evaluator matrix: this is not a gen library, so
# evaluator divergence is not what its CI tests.
jobs:
  deps:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi
      - name: Assert CI check coverage
        run: |
          ci_checks=$(nix eval ./ci#checks.x86_64-linux --apply builtins.attrNames --json)
          root_checks=$(nix eval .#checks.x86_64-linux --apply builtins.attrNames --json)
          expected=$(jq -S -n --argjson ci "$ci_checks" --argjson root "$root_checks" '($ci + $root) | sort | unique')
          missing_from_ci=$(jq -S -n --argjson ci "$ci_checks" --argjson root "$root_checks" '$root - $ci')
          if [ "$missing_from_ci" != "[]" ]; then
            echo "Root flake checks missing from ./ci#checks: $missing_from_ci" >&2
            exit 1
          fi
          read -r -a fast <<< "$FAST_CHECKS"
          read -r -a unit <<< "$UNIT_CHECKS"
          read -r -a integ <<< "$INTEGRATION_CHECKS"
          covered=$(printf '%s\n' "${fast[@]}" "${unit[@]}" "${integ[@]}" | jq -R . | jq -s 'sort | unique')
          if [ "$expected" != "$covered" ]; then
            echo "CI check coverage mismatch!" >&2
            echo "Flake checks (./ci#checks + .#checks): $expected" >&2
            echo "Workflow checks: $covered" >&2
            diff -u <(echo "$expected") <(echo "$covered") >&2 || true
            exit 1
          fi
          echo "All $(echo "$expected" | jq length) checks covered."
      - name: ci devShell
        run: nix eval --raw "./ci#devShells.x86_64-linux.default.drvPath"
      - name: Fast checks
        run: |
          read -r -a fast <<< "$FAST_CHECKS"
          refs=()
          for c in "${fast[@]}"; do
            refs+=("./ci#checks.x86_64-linux.$c")
          done
          nix build -L --keep-going --no-link --print-out-paths "${refs[@]}" | tee -a /tmp/attic-paths
      - name: Build shared binaries and xmsg dependency
        run: |
          nix build -L --no-link --print-out-paths \
            .#packages.x86_64-linux.genie-dispatcher \
            .#packages.x86_64-linux.genie-guard \
            .#packages.x86_64-linux.genie-root \
            ./ci#checks.x86_64-linux.xmsg-integration.xmsgCargoArtifacts \
            ./ci#checks.x86_64-linux.xmsg-integration.xmsgNoCheck \
            | tee -a /tmp/attic-paths
      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          nix shell --inputs-from . nixpkgs#attic-client -c xargs -r -a /tmp/attic-paths attic push ci

  unit:
    needs: [deps]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi
      - name: Admit check userns binaries
        run: |
          read -r -a unit <<< "$UNIT_CHECKS"
          .github/admit-userns.sh "${unit[@]}"
      - name: Unit checks
        run: |
          read -r -a unit <<< "$UNIT_CHECKS"
          refs=()
          for c in "${unit[@]}"; do
            refs+=("./ci#checks.x86_64-linux.$c")
          done
          nix build -L --keep-going --no-link --print-out-paths "${refs[@]}" | tee -a /tmp/attic-paths
      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          nix shell --inputs-from . nixpkgs#attic-client -c xargs -r -a /tmp/attic-paths attic push ci

  integration:
    needs: [deps]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi
      # GS2/GC1: root, tier1, tier1-bridge, and xmsg-integration execute bwrap and util-linux unshare.
      - name: Admit check userns binaries
        run: |
          read -r -a integ <<< "$INTEGRATION_CHECKS"
          .github/admit-userns.sh "${integ[@]}"
      - name: Integration, SEA, and tier-1 bridge checks
        run: |
          read -r -a integ <<< "$INTEGRATION_CHECKS"
          host_refs=()
          vm_refs=()
          for c in "${integ[@]}"; do
            if [ "$c" = "expert-isolation" ]; then
              vm_refs+=("./ci#checks.x86_64-linux.$c")
            else
              host_refs+=("./ci#checks.x86_64-linux.$c")
            fi
          done
          rc=0
          nix build -L --max-jobs 1 --keep-going --no-link --print-out-paths "${host_refs[@]}" | tee -a /tmp/attic-paths || rc=$?
          if [ "${#vm_refs[@]}" -gt 0 ]; then
            nix build -L --keep-going --no-link --print-out-paths "${vm_refs[@]}" | tee -a /tmp/attic-paths || rc=$?
          fi
          exit "$rc"
      - name: Portable native baseline launch
        run: nix run .#portable-baseline
      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          nix shell --inputs-from . nixpkgs#attic-client -c xargs -r -a /tmp/attic-paths attic push ci

  process-plane:
    needs: [deps]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi
      # The runners refuse unprivileged user namespaces; admit only the process plane's own unshare.
      - name: admit the process plane's own unshare to user namespaces
        run: |
          nix build -L --no-link --print-out-paths "./ci#devShells.x86_64-linux.default" | tee -a /tmp/attic-paths
          .github/admit-userns.sh --process-plane
      - name: process plane
        run: nix develop ./ci --command ci --tests-process
      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          nix shell --inputs-from . nixpkgs#attic-client -c xargs -r -a /tmp/attic-paths attic push ci

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi
      - run: nix fmt -- --ci
        working-directory: ci


  macos:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Verify native macOS runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Build portable Node root launcher
        run: nix build -L --no-link .#packages.aarch64-darwin.genie-root-node
      - name: Portable unit plane
        run: nix build -L --no-link ./ci#checks.aarch64-darwin.portable-unit
      - name: Launch root, pi and Nix without bwrap
        run: |
          nix build -L --no-link ./ci#checks.aarch64-darwin.portable-baseline
          nix run .#portable-baseline
