name: OCI Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  oci:
    runs-on: ubuntu-latest
    if: github.repository == 'sini/genie-agent' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build OCI image
        run: |
          nix build .#image --out-link result-image

      - name: Run image oracle check
        run: |
          nix build .#checks.x86_64-linux.image

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker load < result-image
          SHA_SHORT=$(git rev-parse --short HEAD)
          docker tag ghcr.io/sini/genie-guard:latest "ghcr.io/sini/genie-guard:sha-$SHA_SHORT"
          # GHCR sometimes rejects a manifest with "unknown blob" for a layer it has just accepted;
          # re-pushing uploads nothing new and retries the manifest. Bounded at 3 attempts.
          push() { for i in 1 2 3; do docker push "$1" && return 0; echo "docker push $1 failed (attempt $i)" >&2; sleep $((i * 10)); done; return 1; }
          push ghcr.io/sini/genie-guard:latest
          push "ghcr.io/sini/genie-guard:sha-$SHA_SHORT"
